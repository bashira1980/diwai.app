<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — DIWAI</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-navy: #0B1020;
            --graphite: #12161F;
            --warm-orange: #FF7A00;
            --titanium: #E5E7EB;
            --muted: #9CA3AF;
            --card-bg: #161B26;
            --card-border: #1F2937;
            --danger: #EF4444;
            --success: #10B981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--deep-navy);
            color: var(--titanium);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
        .logo img { width: 40px; height: 40px; border-radius: 10px; }
        .logo-text { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.3rem; }
        .logo-text .white { color: #FFFFFF; }
        .logo-text .orange { color: var(--warm-orange); }
        h1 { font-size: 1.4rem; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
        .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }
        .field { margin-bottom: 16px; text-align: left; }
        .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .field input {
            width: 100%;
            padding: 12px 16px;
            background: var(--deep-navy);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--titanium);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--warm-orange); }
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--warm-orange);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #E56D00; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: var(--danger); font-size: 0.9rem; margin-top: 12px; }
        .success { color: var(--success); font-size: 0.9rem; margin-top: 12px; }
        .success-icon { font-size: 3rem; margin-bottom: 16px; }
        .back-link { display: inline-block; margin-top: 20px; color: var(--warm-orange); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .hidden { display: none; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff4; border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="images/logo.png" alt="DIWAI">
            <span class="logo-text"><span class="white">DIW</span><span class="orange">AI</span></span>
        </div>

        <!-- Form state -->
        <div id="form-state">
            <h1>Set a New Password</h1>
            <p class="subtitle">Enter your new password below.</p>

            <div class="field">
                <label for="password">New Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password">
            </div>

            <button class="btn" id="submit-btn" onclick="handleSubmit()">Reset Password</button>
            <div id="error-msg" class="error hidden"></div>
        </div>

        <!-- Success state -->
        <div id="success-state" class="hidden">
            <div class="success-icon">&#9989;</div>
            <h1>Password Updated</h1>
            <p class="subtitle">Your password has been reset successfully. You can now sign in with your new password in the DIWAI app.</p>
        </div>

        <!-- Invalid/expired token state -->
        <div id="invalid-state" class="hidden">
            <div class="success-icon">&#9888;&#65039;</div>
            <h1>Invalid or Expired Link</h1>
            <p class="subtitle">This password reset link is no longer valid. Please request a new one from the app.</p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://diwai-api-production.up.railway.app/api/v1';

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        // Check if token is present
        (function init() {
            const token = getToken();
            if (!token) {
                document.getElementById('form-state').classList.add('hidden');
                document.getElementById('invalid-state').classList.remove('hidden');
            }
        })();

        async function handleSubmit() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('submit-btn');

            errorEl.classList.add('hidden');

            if (password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Resetting...';

            try {
                const resp = await fetch(API_BASE + '/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: getToken(),
                        new_password: password
                    })
                });

                if (resp.ok) {
                    document.getElementById('form-state').classList.add('hidden');
                    document.getElementById('success-state').classList.remove('hidden');
                } else {
                    const data = await resp.json().catch(() => ({}));
                    const detail = data.detail || 'Something went wrong. The link may have expired.';
                    errorEl.textContent = detail;
                    errorEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            } catch (e) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !document.getElementById('form-state').classList.contains('hidden')) {
                handleSubmit();
            }
        });
    </script>
</body>
</html>
